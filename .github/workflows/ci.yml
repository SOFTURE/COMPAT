name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: gates (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Install oasdiff
        run: go install github.com/oasdiff/oasdiff@v1.33.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Test (real oasdiff required)
        run: npm test
        env:
          COMPAT_REQUIRE_OASDIFF: "1"
      - run: npm run build
      - run: npm run test:pack
