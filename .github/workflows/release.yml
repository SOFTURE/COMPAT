name: SOFTURE COMPAT - RELEASE

# Modelled on SOFTURE/skills `release.yml`, but releases are fully automatic: merging a version bump to master
# releases it. On every push to master (and on a manual run from master) the workflow validates the commit and, when
# the `package.json` version is not released yet, publishes it:
#   1. npmjs.com       @softure-ai/compat  (with provenance; trusted publishing over OIDC, `NPM_TOKEN` as fallback)
#   2. GitHub Packages @softure/compat     (GitHub Packages requires the scope to equal the org)
#   3. GitHub Release  vX.Y.Z              (creates the tag on the released commit; generated notes + the tarball)
#   4. Major tag       vX                  (moved to the released commit, so `uses: SOFTURE/COMPAT@vX` follows it)
# Cut a release by bumping the version in a pull request (`npm version minor --no-git-tag-version`) and merging it.
# Every step skips what is already published, so re-running the workflow only fills in what is missing.
#
# npm auth: when the npm trusted publisher (repository SOFTURE/COMPAT, workflow `release.yml`) is configured, npm uses
# OIDC and the `NPM_TOKEN` secret is not needed. Until then (the very first version must be published with a token,
# because npm offers trusted publishing only for a package that exists) the secret is used. Without either, the first
# version is not published and the run says what to add.
#
# Keep this file name: the npm trusted publisher is bound to `release.yml`.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE: "@softure-ai/compat"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
      release: ${{ steps.pending.outputs.release }}
    steps:
      - name: 🛑 Release only from master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Releases run only from master, not from ${GITHUB_REF}"
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 🏷️ Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # A prerelease (1.2.0-rc.1) goes to the `next` dist-tag, so `latest` stays on a stable version.
          DIST_TAG="latest"
          case "${VERSION}" in *-*) DIST_TAG="next" ;; esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dist-tag=${DIST_TAG}" >> "$GITHUB_OUTPUT"
      - name: 🔎 Check what is not released yet
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          RELEASE="false"
          if ! npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE}@${VERSION} is not on npm yet."
            RELEASE="true"
          fi
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "GitHub Release v${VERSION} does not exist yet."
            RELEASE="true"
          fi
          if [ "${RELEASE}" = "false" ]; then
            echo "Version ${VERSION} is fully released; this run only validates."
          fi
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Install oasdiff
        run: go install github.com/oasdiff/oasdiff@v1.33.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: ✅ Test (real oasdiff required)
        run: npm test
        env:
          COMPAT_REQUIRE_OASDIFF: "1"
      - run: npm run build
      - name: 🧪 Test the packed CLI
        run: npm run test:pack
      - name: 📦 Pack
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: "*.tgz"

  publish-npm:
    needs: validate
    if: needs.validate.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: ⬆️ npm with trusted publishing (OIDC) support
        run: npm install -g npm@latest
      - run: npm ci
      - name: 🚀 Publish to npmjs.com
        id: publish
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          DIST_TAG: ${{ needs.validate.outputs.dist-tag }}
          # Kept out of NODE_AUTH_TOKEN so the first attempt authenticates with OIDC (trusted publishing). The token is a
          # fallback only: npm validates the trusted publisher on its first OIDC publish.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE}@${VERSION} is already on npm, skipping."
          elif ! npm view "${PACKAGE}" name >/dev/null 2>&1; then
            # Trusted publishing cannot exist for a package that was never published, so only a token can publish it.
            if [ -z "${NPM_TOKEN}" ]; then
              echo "::warning::${PACKAGE} is not on npm yet and the NPM_TOKEN secret is not set. Add NPM_TOKEN and run this workflow from master to publish ${VERSION}."
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            NODE_AUTH_TOKEN="${NPM_TOKEN}" npm publish --provenance --access public --tag "${DIST_TAG}"
          elif NODE_AUTH_TOKEN="" npm publish --provenance --access public --tag "${DIST_TAG}"; then
            echo "Published ${PACKAGE}@${VERSION} with OIDC (trusted publishing)."
          elif [ -n "${NPM_TOKEN}" ]; then
            echo "::warning::Publishing with OIDC failed; falling back to NPM_TOKEN. Check the npm trusted publisher (SOFTURE/COMPAT, release.yml)."
            NODE_AUTH_TOKEN="${NPM_TOKEN}" npm publish --provenance --access public --tag "${DIST_TAG}"
          else
            echo "::error::Publishing ${PACKAGE}@${VERSION} with OIDC failed and the NPM_TOKEN secret is not set."
            exit 1
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

  publish-github:
    needs: [validate, publish-npm]
    if: needs.publish-npm.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@softure"
      - run: npm ci
      - name: 🔁 Rename to the org scope required by GitHub Packages
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.name = "@softure/compat";
            pkg.publishConfig = { registry: "https://npm.pkg.github.com" };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
      - name: 🚀 Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          DIST_TAG: ${{ needs.validate.outputs.dist-tag }}
        run: |
          if npm view "@softure/compat@${VERSION}" version >/dev/null 2>&1; then
            echo "@softure/compat@${VERSION} is already on GitHub Packages, skipping."
          else
            npm publish --tag "${DIST_TAG}"
          fi

  github-release:
    needs: [validate, publish-npm, publish-github]
    if: needs.publish-npm.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package
      - name: 📝 Create the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          TAG="v${VERSION}"
          NOTES=$(printf '%s\n' \
            "Install from npm: \`npm i -D ${PACKAGE}@${VERSION}\`" \
            "" \
            "Install from this release (no registry, no auth): \`npm i -D https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/softure-ai-compat-${VERSION}.tgz\`" \
            "" \
            "GitHub Packages: \`@softure/compat@${VERSION}\` (requires a token with read:packages)")
          PRERELEASE=""
          case "${VERSION}" in *-*) PRERELEASE="--prerelease" ;; esac
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" softure-ai-compat-*.tgz --clobber
          else
            # Creates the tag on the released commit when it does not exist yet.
            gh release create "${TAG}" softure-ai-compat-*.tgz \
              --target "${GITHUB_SHA}" --generate-notes --title "${TAG}" --notes "${NOTES}" ${PRERELEASE}
          fi

  # `uses: SOFTURE/COMPAT@v0` follows the latest stable release: the major tag is moved to the commit of `vX.Y.Z`.
  # Runs on every push, so a re-run also repairs the tag. A prerelease never moves it, and neither does a release whose
  # commit has no action.yml (versions before the action existed).
  move-major-tag:
    needs: [validate, github-release]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.github-release.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: 🏷️ Move the major tag to the released commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          case "${VERSION}" in *-*) echo "${VERSION} is a prerelease; the major tag stays."; exit 0 ;; esac
          if ! SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/v${VERSION}" --jq .sha 2>/dev/null); then
            echo "Tag v${VERSION} does not exist yet; nothing to move."
            exit 0
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/contents/action.yml?ref=${SHA}" --silent 2>/dev/null; then
            echo "v${VERSION} has no action.yml; the major tag stays."
            exit 0
          fi
          MAJOR="v${VERSION%%.*}"
          CURRENT=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${MAJOR}" --jq .object.sha 2>/dev/null || true)
          if [ "${CURRENT}" = "${SHA}" ]; then
            echo "${MAJOR} already points at v${VERSION} (${SHA})."
          elif [ -n "${CURRENT}" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${MAJOR}" -f sha="${SHA}" -F force=true --silent
            echo "Moved ${MAJOR} to v${VERSION} (${SHA})."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${MAJOR}" -f sha="${SHA}" --silent
            echo "Created ${MAJOR} at v${VERSION} (${SHA})."
          fi
