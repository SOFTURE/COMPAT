name: Publish

# Publishes @softure-ai/compat to npm when the owner pushes a tag `v<package.json version>` on a commit of master.
# Needs the repository secret NPM_TOKEN (an npm automation or granular token with publish rights on @softure-ai).
# Run it by hand (workflow_dispatch) for a dry run: every gate and `npm publish --dry-run`, nothing is published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json and is on master
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version)"
            exit 1
          fi
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::tag $GITHUB_REF_NAME points at a commit that is not on master"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Install oasdiff
        run: go install github.com/oasdiff/oasdiff@v1.33.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Test (real oasdiff required)
        run: npm test
        env:
          COMPAT_REQUIRE_OASDIFF: "1"
      - run: npm run build
      - run: npm run test:pack
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          IS_RELEASE: ${{ github.ref_type == 'tag' }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          # A prerelease (1.2.0-rc.1) goes to the `next` dist-tag, so `latest` stays on a stable version.
          dist_tag="latest"
          case "$version" in *-*) dist_tag="next" ;; esac
          if [ "$IS_RELEASE" != "true" ]; then
            npm publish --dry-run --tag "$dist_tag"
            exit 0
          fi
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::the repository secret NPM_TOKEN is not set"
            exit 1
          fi
          npm publish --provenance --access public --tag "$dist_tag"
